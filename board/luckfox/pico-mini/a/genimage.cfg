# SD card image for Luckfox Pico Mini A
#
# The BootROM loads the idbloader (DDR init + SPL) at 32KiB, and the SPL
# loads U-Boot at 8MiB, so the first partition starts at 16MiB.

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot {
		in-partition-table = "false"
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition rootfs {
		offset = 16M
		partition-type-uuid = L
		image = "rootfs.ext4"
		bootable = true
	}
}
